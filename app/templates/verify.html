{% extends "base_auth.html" %}

{% block title %}Verify Email - {{ app_name }}{% endblock %}

{% block content %}
<div class="text-center mb-8">
    <h1 class="text-3xl font-black text-slate-900 mb-2 tracking-tight">Check your email</h1>
    <p class="text-slate-500 font-medium">We've sent a 6-digit verification code to <span class="font-bold text-slate-800">{{ email }}</span>.</p>
</div>

{% if error %}
<div class="mb-6 p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-600 text-sm font-bold flex items-center gap-2">
    <i data-lucide="alert-circle" class="w-4 h-4"></i>
    {{ error }}
</div>
{% endif %}

<form action="/verify-email" method="POST" class="space-y-5">
    <input type="hidden" name="email" value="{{ email }}">
    
    <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Verification Code</label>
        <input type="text" name="code" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-600 focus:border-transparent transition-all outline-none font-mono text-center text-2xl tracking-widest placeholder:text-slate-300" placeholder="000000" maxlength="6">
    </div>

    <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg hover:shadow-xl transition-all flex items-center justify-center gap-2 mt-4">
        Verify & Continue
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
    </button>
</form>

<div class="mt-8 text-center text-sm font-medium text-slate-500">
    Didn't receive the email? <a href="/register" class="text-blue-600 hover:text-blue-700 font-bold ml-1">Try again</a>
</div>
{% endblock %}
